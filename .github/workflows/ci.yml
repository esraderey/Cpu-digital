name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar ruff
        run: python -m pip install ruff==0.8.6
      - name: Lint
        run: python -m ruff check cpu_digital tests benchmarks tramoya_vm.py

  tests:
    name: tests (Linux, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # El chip TNU exige 3.12; en 3.10 y 3.11 sus pruebas se omiten solas.
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar el proyecto
        run: python -m pip install -e .
      - name: Pruebas
        run: python -m unittest discover -s tests -v

  tests-windows:
    name: tests (Windows, Python 3.13)
    runs-on: windows-latest
    # Informativo: ConsoleOriginTests falla de forma intermitente en Windows
    # (ConnectionAbortedError), una deuda conocida ajena a este flujo.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar el proyecto
        run: python -m pip install -e .
      - name: Pruebas
        run: python -m unittest discover -s tests -v
